<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://yvsqivhdwzbshpapfcsy.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>동그란 사이 · 로그인</title>
<link rel="stylesheet" href="./auth.css">
</head>
<body>
  <main class="auth-card">
    <h1>동그란 사이</h1>
    <p id="authStatus" role="status" aria-live="polite">로그인을 마무리하는 중이에요…</p>
    <form id="recoverForm" class="recover" novalidate hidden>
      <label>새 비밀번호 <input id="recoverPassword" type="password" autocomplete="new-password" minlength="10" maxlength="72" required></label>
      <p class="hint">10자 이상, 영문 소문자·대문자·숫자를 모두 넣어 주세요.</p>
      <button id="recoverSave" type="submit">새 비밀번호 저장</button>
    </form>
    <a id="authBack" class="back" href="../" hidden>게임으로 돌아가기</a>
  </main>
  <script type="module" src="./auth-page.js"></script>
</body>
</html>
